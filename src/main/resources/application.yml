spring:
  application:
    name: groupware

  profiles:
    default: local

  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000      # 1 hour
  refresh-token-expiry: 43200000    # 12 hours (마지막 활동 후 12시간 무활동 시 자동 로그아웃, 슬라이딩)

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  cookie:
    # 기본(local/dev): 동일 도메인이라 Lax + non-secure.
    # 운영(prod)에서 프론트/백 도메인이 다르면 application-prod.yml 에서 None;Secure 로 override.
    same-site: Lax
    secure: false

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash

# 음성 회의록: webm 등 Gemini 미지원 오디오를 ogg(opus)로 변환하는 ffmpeg 실행 경로.
# Docker 이미지에 ffmpeg 설치 → PATH의 'ffmpeg' 사용(기본값). 로컬은 application-local.yml에서 override.
ffmpeg:
  path: ${FFMPEG_PATH:ffmpeg}

google:
  translate:
    api-key: ${GOOGLE_TRANSLATE_API_KEY}
